[project]
name = "gemini-annotator-pipeline"
version = "0.1.0"
description = "Gemini-based video annotation pipeline that labels robot demo videos with task/subtask/atomic-action/recovery-action chunks and pushes them into ogoudey/Annotator over its HTTP API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=0.3.0",
    "requests>=2.31",
]

[project.scripts]
gemini-annotator = "gemini_annotator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_annotator"]
